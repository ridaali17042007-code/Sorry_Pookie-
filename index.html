<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry! 🥺</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #d8aab9; /* Soft Pink */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        #container {
            padding: 20px;
        }

        img {
            height: 200px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        h1 {
            color: #d81b60;
            font-size: 2rem;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative;
        }

        .success-msg {
            display: none;
        }
    </style>
</head>
<body>

    <div id="container">
        <img id="mainGif" src="https://i.pinimg.com/originals/17/3a/12/173a12d6975d4fac4f79702157086485.gif" alt="Cute GIF">
        
        <h1 id="question"> 🥺</h1>

        <div class="buttons" id="buttonGroup">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const phrases = [
            "No",
            "Pookie Sorry...",
            "Please????",
            "If you don't I'll be Very sad..",
            "REALLY SAD.... 🥺",
            "Don't do this to me 👉👈",
            "Last Chance....?"
        ];

        // Replace these with links to different GIFs for each stage
        const gifs = [
            "https://i.pinimg.com/originals/d7/f5/87/d7f587da442a54025daf47091fe26ba0.gif", // initial
            "https://i.pinimg.com/originals/61/47/2b/61472b8ee65a7fc3ea0e98688e32760c.gif", // sad
            "https://i.pinimg.com/originals/61/47/2b/61472b8ee65a7fc3ea0e98688e32760c.gif", // sadder
            "https://i.pinimg.com/originals/17/4d/32/174d32886f2226e9bb871b060cd2d188.gif", // crying
            "https://i.pinimg.com/originals/6e/23/ed/6e23edc5545bac7de126e915e367a3a7.gif"  // desperate
        ];

        let noCount = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainGif = document.getElementById('mainGif');
        const question = document.getElementById('question');

        noBtn.addEventListener('click', () => {
            noCount++;
            
            // 1. Change text on No button
            if (noCount < phrases.length) {
                noBtn.innerText = phrases[noCount];
            }

            // 2. Make Yes button bigger
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize * 1.5) + 'px';
            yesBtn.style.padding = (currentSize * 1.2) + 'px';

            // 3. Change GIF
            if (noCount < gifs.length) {
                mainGif.src = gifs[noCount];
            }

            // 4. THE DODGE (on the last chance)
            if (noCount >= phrases.length - 1) {
                noBtn.style.position = 'absolute';
                moveButton();
                noBtn.addEventListener('mouseover', moveButton);
            }
        });

        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        yesBtn.addEventListener('click', () => {
            document.getElementById('buttonGroup').style.display = 'none';
            question.innerText = "Yay! Besties again! ❤️";
            mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3ImZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/MDJ9IbxxvDUQM/giphy.gif"; // Happy GIF
        });
    </script>
</body>
</html>
